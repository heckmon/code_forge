name: code_forge
description: "A powerful text editor widget, capable of handling 1M+ lines of text smoothly."
version: 11.8.0
homepage: https://github.com/heckmon/code_forge
repository: https://github.com/heckmon/code_forge

topics:
  - code-editor
  - text-editor
  - syntax-highlighting
  - lsp
  - ai-completion
  
environment:
  sdk: ^3.14.0

dependencies:
  flutter: { sdk: flutter }
  flutter_colorpicker: ^1.1.0
  http: ^1.6.0
  material_ui: ^1.11.0
  markdown_widget: ^2.3.2+8
  re_highlight: ^0.0.3
  universal_io: ^2.3.1
  vector_math: ^2.2.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:    
  fonts:
    - family: Method
      fonts:
        - asset: assets/icons/method.ttf
    - family: Variable
      fonts:
        - asset: assets/icons/variable.ttf
    - family: Class
      fonts:
        - asset: assets/icons/class.ttf
    - family: Struct
      fonts:
        - asset: assets/icons/struct.ttf
    - family: Event
      fonts:
        - asset: assets/icons/event.ttf
    - family: Operator
      fonts:
        - asset: assets/icons/operator.ttf
    - family: Interface
      fonts:
        - asset: assets/icons/interface.ttf
    - family: Field
      fonts:
        - asset: assets/icons/field.ttf
